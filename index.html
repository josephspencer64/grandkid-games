<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5bb8f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Grandkid Games">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Grandkid Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#5bb8f0; --sky-deep:#3a9ad6; --ink:#2a2340; --paper:#ffffff;
  --r-tile:22px; --shadow:0 5px 0 var(--ink);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:"Fredoka","Baloo 2",ui-rounded,"Trebuchet MS",system-ui,sans-serif;color:var(--ink);
  background:var(--sky) radial-gradient(circle at 1px 1px,rgba(255,255,255,.22) 1.5px,transparent 2px) 0 0/22px 22px;
  padding:calc(env(safe-area-inset-top,0px) + 18px) 16px calc(env(safe-area-inset-bottom,0px) + 28px);
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;
}
main{max-width:560px;margin:0 auto}
h1{font-size:clamp(2.1rem,9vw,3rem);font-weight:700;line-height:1;text-align:center;color:var(--paper);
  text-shadow:0 4px 0 var(--ink);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;letter-spacing:.01em}
.lead{font-size:1.25rem;font-weight:600;text-align:center;margin:12px 0 18px;color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible,a:focus-visible{outline:4px solid var(--paper);outline-offset:3px}

/* Who's playing */
.kid{display:flex;align-items:center;gap:14px;min-height:68px;padding:10px 14px;border-radius:var(--r-tile);
  background:var(--c);border:3px solid var(--ink);box-shadow:var(--shadow);text-align:left}
.kid:active,.game:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.kid .ini{flex:none;width:48px;height:48px;border-radius:50%;background:var(--paper);border:3px solid var(--ink);
  display:grid;place-items:center;font-size:1.5rem;font-weight:700}
.kid .nm{font-size:1.5rem;font-weight:600;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#kids{grid-template-columns:1fr;max-width:340px;margin:0 auto}
@media (min-width:520px){#kids{grid-template-columns:1fr 1fr;max-width:none}}

/* Games */
.hello{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px 0 18px;flex-wrap:wrap}
.hello .who{font-size:1.5rem;font-weight:700;padding:6px 16px 6px 8px;border-radius:999px;background:var(--c,#fff);border:3px solid var(--ink);display:flex;align-items:center;gap:8px}
.hello .who .ini{width:34px;height:34px;border-radius:50%;background:var(--paper);border:3px solid var(--ink);display:grid;place-items:center;font-size:1.05rem}
.switch{font-size:1rem;font-weight:600;padding:9px 14px;min-height:44px;border-radius:999px;background:rgba(255,255,255,.55);border:3px solid var(--ink)}
.game{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:12px 10px 14px;border-radius:var(--r-tile);
  background:var(--paper);border:3px solid var(--ink);box-shadow:var(--shadow);text-decoration:none;color:var(--ink)}
.game svg{width:86px;height:86px;display:block}
.game b{font-size:1.25rem;font-weight:700;line-height:1.05}
.game span{font-size:.95rem;font-weight:500;line-height:1.2;opacity:.75}
.screen[hidden]{display:none}
.note{margin-top:22px;text-align:center;font-size:.95rem;font-weight:500;opacity:.8}
@media (min-width:560px){.grid.games{grid-template-columns:1fr 1fr 1fr}}
@media (prefers-reduced-motion:reduce){.kid:active,.game:active{transform:none}}
</style>
</head>
<body>
<main>
  <h1>Grandkid Games</h1>

  <section class="screen" id="pick">
    <p class="lead">Who's playing?</p>
    <div class="grid" id="kids"></div>
  </section>

  <section class="screen" id="games" hidden>
    <div class="hello">
      <div class="who" id="who"></div>
      <button class="switch" id="switch">Not you? Switch</button>
    </div>
    <div class="grid games" id="gameList"></div>
    <p class="note">Each game remembers your progress.</p>
  </section>
</main>

<script>
'use strict';
// To add a grandkid, add their name here. Each name keeps its own progress in every game.
const KIDS = ['Torin', 'Navy', 'Callum', 'Emerson', 'Gilia', 'Martin', 'Tatum'];
const KID_COLORS = ['#ff8a7a', '#ffad5c', '#ffd95a', '#a4e06a', '#5fd6c8', '#8fc4ff', '#cfa6ff'];

// Each game lives in its own folder next to this file.
const GAMES = [
  { dir: 'tube-sort', name: 'Tube Sort', what: 'Sort the colored balls', art:
    `<rect x="12" y="14" width="16" height="56" rx="8" fill="#e8f6ff" stroke="#2a2340" stroke-width="3"/>
     <rect x="32" y="14" width="16" height="56" rx="8" fill="#e8f6ff" stroke="#2a2340" stroke-width="3"/>
     <rect x="52" y="14" width="16" height="56" rx="8" fill="#e8f6ff" stroke="#2a2340" stroke-width="3"/>
     <circle cx="20" cy="60" r="6" fill="#ff6b5b"/><circle cx="20" cy="47" r="6" fill="#ff6b5b"/><circle cx="20" cy="34" r="6" fill="#4f9cff"/>
     <circle cx="40" cy="60" r="6" fill="#4f9cff"/><circle cx="40" cy="47" r="6" fill="#ffc83d"/>
     <circle cx="60" cy="60" r="6" fill="#ffc83d"/><circle cx="60" cy="47" r="6" fill="#4f9cff"/><circle cx="60" cy="34" r="6" fill="#ff6b5b"/>` },
  { dir: 'dragon-realms', name: 'Dragon Realms', what: 'Fly and find the lost eggs', art:
    `<path d="M14 38 C22 22 34 22 36 34 C30 30 22 32 14 38 Z" fill="#ff9f43" stroke="#2a2340" stroke-width="3" stroke-linejoin="round"/>
     <path d="M66 38 C58 22 46 22 44 34 C50 30 58 32 66 38 Z" fill="#ff9f43" stroke="#2a2340" stroke-width="3" stroke-linejoin="round"/>
     <path d="M40 16 C52 16 60 36 60 50 C60 62 51 70 40 70 C29 70 20 62 20 50 C20 36 28 16 40 16 Z" fill="#fff4d6" stroke="#2a2340" stroke-width="3"/>
     <circle cx="33" cy="40" r="4" fill="#6fbf5a"/><circle cx="46" cy="50" r="5" fill="#6fbf5a"/><circle cx="36" cy="58" r="3" fill="#6fbf5a"/>` },
  { dir: 'wiener-dog', name: 'My Wiener Dog', what: 'Feed, walk, and grow your puppy', art:
    `<rect x="16" y="34" width="44" height="18" rx="9" fill="#b9733f" stroke="#2a2340" stroke-width="3"/>
     <path d="M14 42 L6 36" stroke="#2a2340" stroke-width="4" stroke-linecap="round"/>
     <rect x="20" y="48" width="6" height="14" rx="3" fill="#b9733f" stroke="#2a2340" stroke-width="3"/>
     <rect x="48" y="48" width="6" height="14" rx="3" fill="#b9733f" stroke="#2a2340" stroke-width="3"/>
     <ellipse cx="64" cy="34" rx="11" ry="9" fill="#b9733f" stroke="#2a2340" stroke-width="3"/>
     <path d="M60 28 C54 32 54 42 58 46 C62 42 63 34 60 28 Z" fill="#7a4520" stroke="#2a2340" stroke-width="2.5" stroke-linejoin="round"/>
     <circle cx="67" cy="32" r="2.2" fill="#2a2340"/><circle cx="75" cy="36" r="2.4" fill="#2a2340"/>` },
  { dir: 'firework-beats', name: 'Firework Beats', what: 'Tap on the beat for fireworks', art:
    `<g stroke-width="4" stroke-linecap="round">
       <path d="M40 8 V20" stroke="#ff6b5b"/><path d="M40 60 V72" stroke="#ffc83d"/>
       <path d="M8 40 H20" stroke="#4f9cff"/><path d="M60 40 H72" stroke="#a4e06a"/>
       <path d="M17 17 L25 25" stroke="#cfa6ff"/><path d="M63 17 L55 25" stroke="#ff6b5b"/>
       <path d="M17 63 L25 55" stroke="#ffc83d"/><path d="M63 63 L55 55" stroke="#4f9cff"/></g>
     <rect x="27" y="27" width="26" height="26" rx="7" fill="#ff8a7a" stroke="#2a2340" stroke-width="3"/>` },
  { dir: 'fuzzy-feet', name: 'Fuzzy Feet', what: 'Sneak, fish, and dress up', art:
    `<g fill="#6b4a32" stroke="#2a2340" stroke-width="2.5">
       <ellipse cx="27" cy="52" rx="10" ry="14"/><circle cx="18" cy="33" r="4"/><circle cx="25" cy="29" r="4"/><circle cx="33" cy="31" r="4"/>
       <ellipse cx="54" cy="40" rx="10" ry="14" transform="rotate(10 54 40)"/><circle cx="48" cy="21" r="4"/><circle cx="56" cy="18" r="4"/><circle cx="64" cy="21" r="4"/></g>` },
  { dir: 'maze-kart-rally', name: 'Maze Kart Rally', what: 'Race through the mazes', art:
    `<rect x="10" y="10" width="60" height="60" rx="10" fill="#e9dcc2" stroke="#2a2340" stroke-width="3"/>
     <path d="M24 10 V44 H44 M56 22 V58 H24 M10 56 H14 M44 22 V32" fill="none" stroke="#2a2340" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="29" y="27" width="10" height="7" rx="2.5" fill="#ff6b5b" stroke="#2a2340" stroke-width="2"/>
     <path d="M62 62 L62 52 L70 55 L62 58" fill="#ffc83d" stroke="#2a2340" stroke-width="2" stroke-linejoin="round"/>` }
];

const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const colorOf = name => { const i = KIDS.findIndex(k => k.toLowerCase() === name.toLowerCase()); return KID_COLORS[(i < 0 ? 0 : i) % KID_COLORS.length]; };
const initial = name => esc(name.trim().charAt(0).toUpperCase());

function showPick() {
  $('kids').innerHTML = KIDS.map(k =>
    `<button class="kid" style="--c:${colorOf(k)}" data-kid="${esc(k)}"><span class="ini" aria-hidden="true">${initial(k)}</span><span class="nm">${esc(k)}</span></button>`).join('');
  $('games').hidden = true; $('pick').hidden = false;
  try { history.replaceState(null, '', location.pathname); } catch (e) { }
}

function showGames(name) {
  const who = $('who');
  who.style.setProperty('--c', colorOf(name));
  who.innerHTML = `<span class="ini" aria-hidden="true">${initial(name)}</span>Hi, ${esc(name)}!`;
  const q = '?player=' + encodeURIComponent(name);
  $('gameList').innerHTML = GAMES.map(g =>
    `<a class="game" href="${g.dir}/index.html${q}"><svg viewBox="0 0 80 80" aria-hidden="true">${g.art}</svg><b>${esc(g.name)}</b><span>${esc(g.what)}</span></a>`).join('');
  $('pick').hidden = true; $('games').hidden = false;
  try { history.replaceState(null, '', location.pathname + q); } catch (e) { }
  window.scrollTo(0, 0);
}

$('kids').addEventListener('click', e => { const b = e.target.closest('[data-kid]'); if (b) showGames(b.dataset.kid); });
$('switch').addEventListener('click', showPick);

// Coming back from a game keeps the same grandkid. Opening the menu fresh always asks who's playing,
// since the grandkids share phones.
const fromLink = (() => { try { return (new URLSearchParams(location.search).get('player') || '').trim().slice(0, 14); } catch (e) { return ''; } })();
if (fromLink) showGames(KIDS.find(k => k.toLowerCase() === fromLink.toLowerCase()) || fromLink);
else showPick();
</script>
</body>
</html>
