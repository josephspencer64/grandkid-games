<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1a2e">
<meta name="description" content="Fly your dragon, find the lost eggs, and bring them home.">
<title>Torin and the Dragon Realms</title>
<style>
:root{--u:1px;--gold:#ffd45c;--gold-d:#c98f1c;--panel:rgba(13,26,50,.92);--mint:#8ff0c8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0b1a2e;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{display:flex;align-items:center;justify-content:center;font-family:ui-rounded,"SF Pro Rounded","Nunito","Varela Round","Trebuchet MS",system-ui,sans-serif;color:#fff;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#stage{position:relative;overflow:hidden;--u:1px;background:#0b1a2e}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
/* HUD */
#hud{position:absolute;left:0;right:0;top:0;height:calc(50*var(--u));display:flex;align-items:center;gap:calc(14*var(--u));padding:0 calc(14*var(--u));
  background:linear-gradient(rgba(8,16,34,.6),rgba(8,16,34,0));pointer-events:none;font-weight:800;font-size:max(15px,calc(22*var(--u)));text-shadow:0 2px 0 rgba(0,0,0,.35)}
#hud.hidden{display:none}
.hud-eggs{display:flex;align-items:center;gap:calc(8*var(--u));min-width:calc(96*var(--u))}
.egg-ico{display:inline-block;width:calc(17*var(--u));height:calc(22*var(--u));min-width:12px;min-height:16px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
  background:radial-gradient(circle at 35% 30%,#fff 0 18%,#fff4d6 19% 100%);box-shadow:inset -3px -3px 0 rgba(0,0,0,.12),0 0 10px rgba(255,220,120,.7)}
.egg-ico.pop{animation:pop .35s ease}
@keyframes pop{50%{transform:scale(1.5)}}
#hudBar{flex:1;height:calc(10*var(--u));min-height:6px;background:rgba(255,255,255,.22);border-radius:99px;overflow:hidden}
#hudFill{height:100%;width:0;background:linear-gradient(90deg,#ffd45c,#ff9f43);border-radius:99px}
#hudHearts{display:flex;align-items:center}
#hudHearts.pop{animation:pop .4s ease}
#hudHearts svg{width:max(16px,calc(24*var(--u)));height:max(15px,calc(22*var(--u)));margin-left:calc(3*var(--u))}
.icon-btn{pointer-events:auto;width:max(42px,calc(48*var(--u)));height:max(36px,calc(40*var(--u)));border-radius:calc(12*var(--u));border:2px solid rgba(255,255,255,.55);
  background:rgba(8,16,34,.55);color:#fff;font:inherit;font-weight:900;font-size:max(14px,calc(16*var(--u)));display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation}
/* Screens */
.screen{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:calc(14*var(--u));background:rgba(5,12,28,.28)}
.screen.active{display:flex}
.panel{background:var(--panel);border:calc(3*var(--u)) solid var(--gold);border-radius:calc(22*var(--u));padding:calc(20*var(--u)) calc(28*var(--u));max-width:100%;max-height:100%;
  overflow:auto;text-align:center;box-shadow:0 calc(10*var(--u)) calc(40*var(--u)) rgba(0,0,0,.45);-webkit-overflow-scrolling:touch;touch-action:pan-y}
.kicker{font-size:max(11px,calc(15*var(--u)));letter-spacing:.16em;color:var(--mint);font-weight:800;text-transform:uppercase}
h1{font-size:max(24px,calc(46*var(--u)));color:var(--gold);line-height:1.08;text-shadow:0 3px 0 rgba(0,0,0,.35);margin:calc(4*var(--u)) 0 calc(8*var(--u))}
h2{font-size:max(18px,calc(30*var(--u)));color:var(--gold);margin-bottom:calc(8*var(--u))}
p{font-size:max(15px,calc(21*var(--u)));line-height:1.35;margin:calc(6*var(--u)) 0}
p.small{font-size:max(12px,calc(15*var(--u)));opacity:.8}
.btn{font:inherit;font-weight:800;font-size:max(16px,calc(22*var(--u)));padding:calc(11*var(--u)) calc(26*var(--u));min-height:44px;border-radius:calc(14*var(--u));border:none;cursor:pointer;
  background:var(--gold);color:#2a1a05;box-shadow:0 calc(4*var(--u)) 0 var(--gold-d);margin:calc(6*var(--u));touch-action:manipulation}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--gold-d)}
.btn.alt{background:rgba(255,255,255,.12);color:#fff;box-shadow:0 calc(4*var(--u)) 0 rgba(0,0,0,.3);border:2px solid rgba(255,255,255,.35)}
.btn.small{font-size:max(14px,calc(17*var(--u)));padding:calc(8*var(--u)) calc(16*var(--u));min-height:40px}
.btn.on{background:var(--mint);color:#08301f;box-shadow:0 calc(4*var(--u)) 0 #3aa37a;border:none}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:calc(14*var(--u));justify-content:center;flex-wrap:wrap}
/* Setup */
.fields{display:flex;gap:calc(16*var(--u));margin:calc(8*var(--u)) 0}
.fields label{flex:1;text-align:left;font-weight:800;font-size:max(13px,calc(17*var(--u)))}
.fields input{display:block;width:100%;margin-top:calc(5*var(--u));font:inherit;font-weight:700;font-size:max(16px,calc(21*var(--u)));padding:calc(9*var(--u)) calc(12*var(--u));
  border-radius:calc(12*var(--u));border:2px solid #7a8db0;background:#f5f8ff;color:#15203a;-webkit-user-select:text;user-select:text;touch-action:manipulation}
.dragons{display:grid;grid-template-columns:repeat(4,1fr);gap:calc(10*var(--u));margin:calc(10*var(--u)) 0}
.dcard{font:inherit;color:#fff;cursor:pointer;background:rgba(255,255,255,.07);border:calc(3*var(--u)) solid rgba(255,255,255,.2);border-radius:calc(16*var(--u));
  padding:calc(6*var(--u)) calc(6*var(--u)) calc(8*var(--u));touch-action:manipulation}
#riderList{margin:calc(4*var(--u)) 0}#riderList:empty{display:none}
.dcard.sel{border-color:var(--gold);background:rgba(255,212,92,.14)}
.dcard canvas{width:100%;aspect-ratio:5/3;display:block}
.dcard b{display:block;font-size:max(15px,calc(21*var(--u)))}
.dcard span{display:block;font-size:max(11px,calc(14*var(--u)));opacity:.85}
.dcard i{display:block;font-style:normal;font-size:max(11px,calc(14*var(--u)));color:#ff8fa3;margin-top:calc(3*var(--u))}
/* Map */
.map-panel{width:100%;height:100%;display:flex;flex-direction:column;padding:calc(10*var(--u)) calc(16*var(--u));overflow:hidden}
.map-head{display:flex;align-items:center;justify-content:space-between;gap:calc(12*var(--u));flex-wrap:wrap}
.map-head h2{margin:0;font-size:max(17px,calc(28*var(--u)))}
.realms{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:calc(8*var(--u));margin:calc(8*var(--u)) 0}
.rcard{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;font:inherit;color:#fff;cursor:pointer;background:rgba(255,255,255,.07);
  border:calc(3*var(--u)) solid rgba(255,255,255,.25);border-radius:calc(12*var(--u));padding:calc(4*var(--u));touch-action:manipulation;overflow:hidden}
.rcard:not([disabled]):hover,.rcard[data-primary]{border-color:var(--gold)}
.rcard[disabled]{opacity:.5;cursor:default}
.rcard canvas{flex:1 1 auto;min-height:0;width:100%;display:block;border-radius:calc(8*var(--u))}
.rcard b{flex:none;display:block;font-size:max(10px,calc(14*var(--u)));margin-top:calc(3*var(--u));line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcard span{position:absolute;left:calc(8*var(--u));top:calc(8*var(--u));font-size:max(10px,calc(13*var(--u)));font-weight:800;background:rgba(8,16,34,.75);
  padding:calc(2*var(--u)) calc(7*var(--u));border-radius:99px}
.map-foot{display:flex;justify-content:center;gap:calc(10*var(--u))}
.map-foot .btn{margin:0}
.trophies.tight{margin:calc(6*var(--u)) 0}
.toggles .btn{margin:calc(3*var(--u)) calc(5*var(--u))}
.hearts-line{color:#ff8fa3;font-weight:800}
.trophies{display:flex;gap:calc(18*var(--u));justify-content:center;flex-wrap:wrap;font-weight:800;font-size:max(13px,calc(18*var(--u)))}
.eggrow{display:flex;flex-wrap:wrap;gap:calc(5*var(--u));justify-content:center;margin:calc(10*var(--u)) 0}
.eggrow .egg-ico.off{background:rgba(255,255,255,.18);box-shadow:none}
.settings{display:flex;flex-direction:column;align-items:center;gap:calc(2*var(--u));margin:calc(8*var(--u)) 0}
.settings .lbl{font-weight:800;font-size:max(13px,calc(16*var(--u)));opacity:.8;margin-top:calc(6*var(--u))}
#setMsg,#setMsg2{min-height:1em;color:#ffb3b3}
#rotate{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#0b1a2e;padding:24px;text-align:center}
#rotate.active{display:flex}
#rotate .phone{width:60px;height:100px;border:5px solid var(--gold);border-radius:12px;animation:turn 2.2s ease-in-out infinite}
@keyframes turn{0%,25%{transform:rotate(0)}55%,100%{transform:rotate(90deg)}}
#rotate p{font-size:20px}
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
  <div id="hud" class="hidden">
    <div class="hud-eggs"><span class="egg-ico" id="hudEggIco"></span><span id="hudEggs">0 / 15</span></div>
    <div id="hudBar"><div id="hudFill"></div></div>
    <div id="hudHearts"></div>
    <button class="icon-btn" id="btnPause" data-action="pause" aria-label="Pause">II</button>
  </div>

  <section class="screen" id="scr-title">
    <div class="panel">
      <div class="kicker">Torin and the</div>
      <h1>Dragon Realms</h1>
      <p>Fly your dragon. Find the lost eggs. Bring them home!</p>
      <p id="titleWho" class="small"></p>
      <div class="row" id="riderList"></div>
      <div class="row">
        <button class="btn" data-action="play" data-primary>Play</button>
        <button class="btn alt" data-action="newRider" id="btnNewRider">New rider</button>
        <button class="btn alt" data-action="settings">Settings</button>
      </div>
      <p class="small" id="titleHint"></p>
    </div>
  </section>

  <section class="screen" id="scr-setup">
    <div class="panel">
      <h2>Welcome, Dragon Rider!</h2>
      <div class="fields">
        <label>Your name<input id="inRider" maxlength="14" autocomplete="off" placeholder="Torin"></label>
        <label>Your dragon's name<input id="inDragon" maxlength="14" autocomplete="off" placeholder="Ember"></label>
      </div>
      <div class="dragons" id="dragonCards"></div>
      <button class="btn" data-action="setupDone" data-primary>Let's fly!</button>
    </div>
  </section>

  <section class="screen" id="scr-map">
    <div class="panel map-panel">
      <div class="map-head"><h2>Choose a realm</h2><div class="trophies" id="trophies"></div></div>
      <div class="realms" id="realmCards"></div>
      <div class="map-foot">
        <button class="btn alt small" data-action="toTitle">Back</button>
        <button class="btn alt small" data-action="settings">Settings</button>
      </div>
    </div>
  </section>

  <section class="screen" id="scr-intro">
    <div class="panel" style="max-width:calc(640*var(--u))">
      <div class="kicker" id="introKicker"></div>
      <h1 id="introName"></h1>
      <p id="introStory"></p>
      <p class="small" id="introTip"></p>
      <p id="introHearts" class="hearts-line"></p>
      <button class="btn" data-action="start" data-primary>Fly!</button>
    </div>
  </section>

  <section class="screen" id="scr-pause">
    <div class="panel">
      <h2>Paused</h2>
      <button class="btn" data-action="resume" data-primary>Keep flying</button>
      <div class="settings" id="pauseSettings"></div>
      <div class="row">
        <button class="btn alt small" data-action="restart">Start realm over</button>
        <button class="btn alt small" data-action="quit">Leave to map</button>
      </div>
    </div>
  </section>

  <section class="screen" id="scr-settings">
    <div class="panel">
      <h2>Settings</h2>
      <div class="settings" id="mainSettings"></div>
      <button class="btn" data-action="settingsBack" data-primary>Done</button>
    </div>
  </section>

  <section class="screen" id="scr-result">
    <div class="panel">
      <div class="kicker" id="resKicker"></div>
      <h1 id="resTitle"></h1>
      <div class="eggrow" id="resEggs"></div>
      <div id="resMsgs"></div>
      <div class="trophies tight" id="resTrophies"></div>
      <div class="row toggles" id="resToggles"></div>
      <div class="row" id="resBtns"></div>
    </div>
  </section>

  <section class="screen" id="scr-over">
    <div class="panel">
      <h1 id="overTitle"></h1>
      <p id="overMsg"></p>
      <div class="row toggles" id="overToggles"></div>
      <div class="row">
        <button class="btn" data-action="retry" data-primary>Try again</button>
        <button class="btn alt" data-action="quit">Map</button>
      </div>
    </div>
  </section>
</div>

<div id="rotate">
  <div class="phone"></div>
  <p>Turn your phone sideways to play!</p>
  <button class="btn alt small" data-action="rotateOK">Play this way anyway</button>
</div>

<script>
'use strict';
// ============ Core: sizing, data, save, input ============
const H = 540, TW = 1400, TAU = Math.PI * 2;
let W = 960, SCALE = 1, DPR = 1, booted = false;
const $ = s => document.querySelector(s);
const canvas = $('#game'), ctx = canvas.getContext('2d'), stage = $('#stage');
const isTouch = (window.matchMedia && matchMedia('(pointer: coarse)').matches) || ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---- Dragons (original designs) ----
const DRAGONS = {
  ember: { name: 'Ember', kind: 'Fire dragon', desc: 'Brave and balanced', body: '#e2553a', dark: '#a8321f', belly: '#ffc978', wing: '#f39045', wingDark: '#b8452a', horn: '#fff1c9', eye: '#ffc21f', line: '#4a140b', breath: ['#fff6a8', '#ffb030', '#ff5a1f'], speed: 1.0, hearts: 4, magnet: 85 },
  frost: { name: 'Frost', kind: 'Ice dragon', desc: 'The quickest flyer', body: '#4da3e8', dark: '#2a6aa8', belly: '#e3f6ff', wing: '#98d6ff', wingDark: '#3b7fc0', horn: '#ffffff', eye: '#35e0ff', line: '#12314f', breath: ['#ffffff', '#bff2ff', '#5ecbff'], speed: 1.15, hearts: 3, magnet: 85 },
  moss: { name: 'Moss', kind: 'Forest dragon', desc: 'Strong and steady', body: '#5daa4a', dark: '#35702a', belly: '#eef6b0', wing: '#94cf66', wingDark: '#3f7a30', horn: '#f4e3b0', eye: '#ffd83a', line: '#163a10', breath: ['#f6ffc8', '#b6f060', '#4fbf3a'], speed: 0.88, hearts: 5, magnet: 85 },
  sunny: { name: 'Sunny', kind: 'Sun dragon', desc: 'Finds eggs easily', body: '#f2b632', dark: '#b87a14', belly: '#fff3c9', wing: '#ffd66b', wingDark: '#c98d1c', horn: '#ffffff', eye: '#7a4cff', line: '#5a3606', breath: ['#fffbe0', '#ffe36b', '#ff9f1c'], speed: 1.0, hearts: 4, magnet: 160 }
};
const DRAGON_KEYS = Object.keys(DRAGONS);
const DS = 0.8; // dragon draw scale in game

// ---- Realms ----
// cat: land (ground below), cave (ceiling + floor), water (sea/lava below).
// skin picks which hazards and creatures appear. Difficulty rises with each realm.
const LAND = { top: 88, bottom: 460, ground: 490 }, CAVE = { top: 96, bottom: 456, ground: 486 }, WATER = { top: 88, bottom: 440, ground: 468 };
const REALMS = [
  { name: 'The Green Valley', short: 'Green Valley', cat: 'land', biome: 'valley', ...LAND, egg: ['#fff4d6', '#6fbf5a'],
    skin: { tall: ['pine'], low: 'rock', flyer: ['crow'] }, song: { bpm: 120, root: 62, scale: 'major', seed: 11, lead: 'square', drums: true },
    story: 'Oh no! The dragon eggs rolled out of their nests. Fly over the valley and find all 15!' },
  { name: 'The Crystal Caverns', short: 'Crystal Caverns', cat: 'cave', biome: 'caverns', ...CAVE, egg: ['#ece0ff', '#a57bff'],
    skin: { spike: 'rock', floor: 'crystal', flyer: ['bat'] }, song: { bpm: 100, root: 57, scale: 'minor', seed: 5, lead: 'triangle', drums: true },
    story: 'Some eggs bounced into the glowing caves. Fly between the sharp rocks. Watch out for bats!' },
  { name: 'The Sunken Realm', short: 'Sunken Realm', cat: 'water', biome: 'sunken', ...WATER, egg: ['#dcfbff', '#35b9c9'],
    skin: { pillar: ['ruin'], jumper: 'fish', flyer: ['gull'] }, song: { bpm: 108, root: 55, scale: 'mixo', seed: 23, lead: 'square', drums: true, swing: true },
    story: 'The last eggs floated out to sea. Fly past the old ruins and the jumping fish!' },
  { name: 'The Autumn Woods', short: 'Autumn Woods', cat: 'land', biome: 'autumn', ...LAND, egg: ['#fff0dc', '#e0782a'],
    skin: { tall: ['oak', 'pine'], low: 'rock', flyer: ['owl', 'crow'] }, song: { bpm: 112, root: 60, scale: 'major', seed: 31, lead: 'triangle', drums: true },
    story: 'The wind blew eggs into the autumn woods. The owls here are wide awake!' },
  { name: 'The Frozen Peaks', short: 'Frozen Peaks', cat: 'land', biome: 'frozen', ...LAND, egg: ['#f4fbff', '#7fb8e6'],
    skin: { tall: ['snowpine'], low: 'snowrock', flyer: ['eagle'] }, song: { bpm: 104, root: 64, scale: 'minor', seed: 41, lead: 'triangle', drums: true },
    story: 'Brrr! Some eggs rolled up into the snowy mountains. Big eagles guard these peaks.' },
  { name: 'The Desert Canyon', short: 'Desert Canyon', cat: 'land', biome: 'desert', ...LAND, egg: ['#fff6e0', '#d9913a'],
    skin: { tall: ['cactus', 'mesa'], low: 'sandrock', flyer: ['vulture'] }, song: { bpm: 116, root: 62, scale: 'hijaz', seed: 53, lead: 'square', drums: true },
    story: 'Hot sand as far as you can see! Fly over the cactus and away from the hungry vultures.' },
  { name: 'The Mushroom Grotto', short: 'Mushroom Grotto', cat: 'cave', biome: 'grotto', ...CAVE, egg: ['#f0ffe6', '#58c46a'],
    skin: { spike: 'root', floor: 'mushroom', flyer: ['mothbat'] }, song: { bpm: 98, root: 55, scale: 'dorian', seed: 67, lead: 'triangle', drums: true },
    story: 'Deep under the forest, giant mushrooms glow in the dark. Fly carefully between them!' },
  { name: 'The Jungle River', short: 'Jungle River', cat: 'water', biome: 'jungle', ...WATER, egg: ['#fffbe0', '#3fa84a'],
    skin: { pillar: ['stump'], jumper: 'piranha', flyer: ['parrot'] }, song: { bpm: 124, root: 57, scale: 'mixo', seed: 71, lead: 'square', drums: true, swing: true },
    story: 'Down the jungle river we go! Snappy fish jump out of the water here.' },
  { name: 'The Stormy Heights', short: 'Stormy Heights', cat: 'land', biome: 'storm', ...LAND, egg: ['#eef2ff', '#6a7fd6'],
    skin: { tall: ['pine', 'spire'], low: 'rock', flyer: ['raven'], storm: true }, song: { bpm: 128, root: 57, scale: 'minor', seed: 83, lead: 'square', drums: true },
    story: 'Thunder is rumbling! When a storm cloud starts to glow, lightning is coming. Stay out from under it!' },
  { name: 'The Ice Caves', short: 'Ice Caves', cat: 'cave', biome: 'ice', ...CAVE, egg: ['#ffffff', '#8fd8ff'],
    skin: { spike: 'ice', floor: 'icecrystal', flyer: ['icebat'] }, song: { bpm: 106, root: 62, scale: 'minor', seed: 97, lead: 'triangle', drums: true },
    story: 'Everything in this cave is made of ice. The icicles are sharp, so fly with care!' },
  { name: 'The Night Sea', short: 'Night Sea', cat: 'water', biome: 'night', ...WATER, egg: ['#fffbe8', '#e8c54a'],
    skin: { pillar: ['seastack', 'lighthouse'], jumper: 'nightfish', flyer: ['owl', 'gull'] }, song: { bpm: 100, root: 53, scale: 'minor', seed: 103, lead: 'triangle', drums: true, swing: true },
    story: 'The moon lights the way across the dark sea. Follow the lighthouse glow!' },
  { name: 'The Volcano Isle', short: 'Volcano Isle', cat: 'water', biome: 'volcano', ...WATER, egg: ['#fff0e0', '#ff6a2a'],
    skin: { pillar: ['basalt'], jumper: 'lava', flyer: ['firebat'] }, song: { bpm: 132, root: 52, scale: 'hijaz', seed: 113, lead: 'square', drums: true },
    story: 'The lava is bubbling! Blobs of lava jump up where you see bubbles. Stay away from them!' },
  { name: 'Dragon Mountain', short: 'Dragon Mountain', cat: 'land', biome: 'mountain', ...LAND, egg: ['#fff8d0', '#ffb000'],
    skin: { tall: ['spire', 'pine'], low: 'rock', flyer: ['eagle', 'raven'], storm: true }, song: { bpm: 136, root: 62, scale: 'major', seed: 127, lead: 'square', drums: true },
    story: 'This is it! The dragons live at the top of the mountain. Bring the last eggs home!' }
];
REALMS.forEach((R, i) => { R.speed = 145 + 10 * i; R.length = 9000 + 250 * i; R.level = i / (REALMS.length - 1); });

// ---- Save: one save per rider ----
// Each rider gets their own save slot, so grandkids never share progress.
// A launcher can pick the rider by link: index.html?player=Navy
const LEGACY_KEY = 'dragon-realms-v2', ROSTER_KEY = 'dragon-realms-riders';

      case 'tallflyer': { tall(x0 + w * 0.3, rnd(140, 185)); const a = rnd(140, 175); flyer(x0 + w * 0.72, a, d); addEgg(x0 + w * 0.82, 402); break; }
      case 'double': { tall(x0 + w * 0.12, rnd(150, 185 + 25 * df)); tall(x0 + w * 0.88, rnd(150, 185 + 25 * df)); addEgg(x0 + w * 0.5, rnd(385, 405)); break; }
      case 'flock': { const a = rnd(150, 180); flyer(x0 + w * 0.45, a, d); flyer(x0 + w * 0.8, a + 200, d); addEgg(x0 + w * 0.2, a + 100); break; }
      case 'lowflyer': { low(x0 + w * 0.3, rnd(60, 85)); const a = rnd(140, 180); flyer(x0 + w * 0.75, a, d); addEgg(x0 + w * 0.6, 330); break; }
      case 'storm': { const sx = x0 + w * 0.5; storm(sx); addEgg(r() < 0.5 ? x0 + w * 0.12 : x0 + w * 0.88, rnd(220, 380)); break; }
      case 'stormflyer': { storm(x0 + w * 0.35); const a = rnd(150, 390); flyer(x0 + w * 0.85, a, d); addEgg(x0 + w * 0.08, band(a)); break; }
      case 'stormlow': { storm(x0 + w * 0.3); low(x0 + w * 0.72, rnd(60, 85)); addEgg(x0 + w * 0.9, 300); break; }
      // ----- cave -----
      case 'gate': case 'gateflyer': case 'doublegate': {

        const pickY = () => rnd(CEIL + 45 + gap / 2, G - 45 - gap / 2);
        const x = x0 + w * (p === 'doublegate' ? 0.28 : 0.4), yc = pickY();
        spike(x, yc - gap / 2 - CEIL, sw, 1); spike(x, G - (yc + gap / 2), sw, -1); addEgg(x, yc);
        if (p === 'gateflyer') { const f = pick(S.flyer); ents.push({ kind: 'flyer', flyer: true, style: f, x: x0 + w * 0.95, baseY: yc, y: yc, amp: 12, spd: 45, w: 2, ph: 0, tt: 0, alive: true, rad: 17 }); }
        if (p === 'doublegate') { let y2 = clamp(yc + (r() < 0.5 ? -1 : 1) * rnd(90, 130), CEIL + 45 + gap / 2, G - 45 - gap / 2); const x2 = x0 + w * 0.8; spike(x2, y2 - gap / 2 - CEIL, sw, 1); spike(x2, G - (y2 + gap / 2), sw, -1); }

      }
      case 'weave': { spike(x0 + w * 0.2, rnd(190, 225 + 15 * df), 64, 1); spike(x0 + w * 0.72, rnd(180, 215 + 15 * df), 64, -1); addEgg(x0 + w * 0.46, 282); break; }
      case 'floor': { const h = rnd(60, 100 + 40 * df), x = x0 + w * 0.4; floor(x, h); addEgg(x, G - h - 85); break; }
      case 'floorflyer': { const h = rnd(60, 95), x = x0 + w * 0.3; floor(x, h); const a = rnd(150, 200); flyer(x0 + w * 0.8, a, d); addEgg(x0 + w * 0.62, 360); break; }
      case 'pair': { const a = rnd(150, 175); flyer(x0 + w * 0.45, a, d); flyer(x0 + w * 0.8, a + 215, d); addEgg(x0 + w * 0.2, a + 105); break; }
      // ----- water -----
      case 'pillar': { const x = x0 + w * 0.4, h = pillar(x, rnd(110, 170 + 80 * df), rnd(46, 58)); if (r() < 0.5 && G - h - 75 > R.top + 20) addEgg(x, G - h - 75); else addEgg(x0 + w * 0.84, rnd(370, 405)); break; }
      case 'pillars': { pillar(x0 + w * 0.22, rnd(140, 200 + 20 * df), 50); pillar(x0 + w * 0.8, rnd(140, 200 + 20 * df), 50); addEgg(x0 + w * 0.51, 398); break; }
      case 'jumper': { const apex = rnd(200, 260) - 60 * df, x = x0 + w * 0.5; jumper(x, apex); if (apex - 85 > R.top + 20) addEgg(x, apex - 85); else addEgg(x0 + w * 0.88, 395); break; }
      case 'twojumpers': { jumper(x0 + w * 0.28, rnd(200, 250)); jumper(x0 + w * 0.74, rnd(190, 230)); addEgg(x0 + w * 0.51, 132); break; }
      case 'pillarflyer': { pillar(x0 + w * 0.3, rnd(120, 170), 52); const a = rnd(140, 172); flyer(x0 + w * 0.72, a, d); addEgg(x0 + w * 0.84, 398); break; }
      case 'jumperflyer': { jumper(x0 + w * 0.45, rnd(210, 250)); const a = rnd(140, 170); flyer(x0 + w * 0.9, a, d); addEgg(x0 + w * 0.15, 320); break; }
      case 'pillarjumper': { const h = pillar(x0 + w * 0.28, rnd(120, 175), 50); jumper(x0 + w * 0.76, rnd(210, 250)); addEgg(x0 + w * 0.28, G - h - 75); break; }
    }
    // Later realms add an extra creature to a section, always in a height band well away from its egg.
    const egg = eggs[eggsBefore];

      let a = egg.by < mid ? egg.by + 175 : egg.by - 175; a = clamp(a, R.top + 25, R.bottom - 20);

  // Between sections, later realms add extra obstacles. Each one stays at least 70px above or below

  for (let i = 1; i < 15; i++) {
    if (r() > 0.1 + 0.85 * dl) continue;
    const bx = 1000 + i * segW + rnd(-25, 25);
    const near = eggs.filter(e => Math.abs(e.x - bx) < 260);
    if (near.some(e => Math.abs(e.x - bx) < 110)) continue;
    if (ents.some(e => e.boxes && Math.abs(e.x - bx) < 110)) continue;

    const fromFloor = G - (lowest + 70);        // tallest obstacle that still clears the eggs
    const fromCeil = (highest - 70) - CEIL;     // longest cave spike that still clears the eggs
    if (R.cat === 'land') { if (fromFloor >= 150) tall(bx, Math.min(fromFloor, 170 + 110 * dl)); else if (fromFloor >= 70) low(bx, Math.min(fromFloor, 85)); }
    else if (R.cat === 'water') { if (fromFloor >= 90) pillar(bx, Math.min(fromFloor, 150 + 110 * dl), rnd(44, 54)); }
    else {
      if (fromCeil >= 80 && (fromCeil >= fromFloor || fromFloor < 80)) spike(bx, Math.min(fromCeil, 120 + 150 * dl), rnd(54, 66), 1);
      else if (fromFloor >= 80) { if (r() < 0.5) spike(bx, Math.min(fromFloor, 110 + 140 * dl), rnd(54, 66), -1); else floor(bx, Math.min(fromFloor, 70 + 70 * dl)); }
    }
  }

  return { ents, eggs, nest };
}

// ============ Game: state, update, render ============
const Game = {
  state: 'menu', ri: 0, L: null, cam: 0, t: 0, p: null, eggs: 0, hearts: 3, maxHearts: 3,
  proj: [], parts: [], texts: [], shake: 0, fireCd: 0, goalT: 0, overT: 0, menuCam: 0, menuRi: 0,
  combo: 0, comboT: 0, usingKeys: !isTouch, fireQueued: false, celebrated: false,

  prepare(ri) {
    this.ri = ri; this.L = buildLevel(ri);
    const D = DRAGONS[save.dragon];
    this.p = { x: 170, y: 270, vx: 0, vy: 0, tx: 170, ty: 270, flap: 0, ang: 0, inv: 0, alive: true };
    this.maxHearts = D.hearts; this.hearts = save.hearts == null ? D.hearts : clamp(save.hearts, 1, HEART_CAP); this.startHearts = this.hearts;
    this.cam = 0; this.eggs = 0; this.proj.length = 0; this.parts.length = 0; this.texts.length = 0;
    this.shake = 0; this.goalT = 0; this.overT = 0; this.combo = 0; this.celebrated = false; this.fireQueued = false;
    this.state = 'intro';
    HUD.show(true); HUD.update();
  },
  begin() {
    this.state = 'play'; Input.drag = null;
    if (Input.tilt.on) Input.tilt.base = null;
    Sound.play('r' + this.ri);
  },
  restart() { this.prepare(this.ri); UI.hideAll(); this.begin(); },
  togglePause() {
    if (this.state === 'play') { this.state = 'paused'; Input.drag = null; UI.show('pause'); }
    else if (this.state === 'paused') { UI.hideAll(); this.state = 'play'; Input.drag = null; }
  },
  toMenu() { this.state = 'menu'; HUD.show(false); Sound.play('title'); },
  bounds() { const R = REALMS[this.ri]; return { x0: 50, x1: W * 0.62, y0: R.top, y1: R.bottom }; },
  startDrag() { this.usingKeys = false; this.p.tx = this.p.x; this.p.ty = this.p.y; },
  dragBy(dx, dy) { const b = this.bounds(); this.p.tx = clamp(this.p.tx + dx, b.x0, b.x1); this.p.ty = clamp(this.p.ty + dy, b.y0, b.y1); },

  // world-space hit circles for the dragon (body + head only; wings and tail never hurt you)
  hitCircles() {

    return [{ x: this.cam + p.x, y: p.y + 2, r: 16 }, { x: this.cam + p.x + hx * c - hy * s, y: p.y + hx * s + hy * c, r: 11 }];
  },
  mouth() { const p = this.p, c = Math.cos(p.ang), s = Math.sin(p.ang), mx = 80 * DS, my = -27 * DS; return { x: this.cam + p.x + mx * c - my * s, y: p.y + mx * s + my * c }; },

  update(dt) {
    this.t += dt;
    if (this.state === 'menu') { this.menuCam += 45 * dt; }
    if (this.state === 'intro' || this.state === 'menu') { if (this.p) this.p.flap += dt * 9; }
    if (this.state === 'play' || this.state === 'goal' || this.state === 'dying') this.step(dt);
    if (this.state !== 'paused') this.updateParticles(dt);
  },

  step(dt) {
    const R = REALMS[this.ri], D = DRAGONS[save.dragon], p = this.p, b = this.bounds();
    const stopX = this.L.nest.x - W * 0.7;
    if (this.state === 'play') {
      this.cam = Math.min(stopX, this.cam + R.speed * dt);
      if (this.cam >= stopX) { this.state = 'goal'; this.goalT = 0; Input.drag = null; p.inv = 0; }
      // --- movement: quick to start, quick to stop ---
      const maxS = 390 * D.speed;
      if (Input.drag) {
        let vx = (p.tx - p.x) * 12, vy = (p.ty - p.y) * 12; const m = Math.hypot(vx, vy), lim = maxS * 1.7;
        if (m > lim) { vx *= lim / m; vy *= lim / m; }
        const k = Math.min(1, dt * 22); p.vx += (vx - p.vx) * k; p.vy += (vy - p.vy) * k;
      } else {
        let ix = (Input.keys.right ? 1 : 0) - (Input.keys.left ? 1 : 0), iy = (Input.keys.down ? 1 : 0) - (Input.keys.up ? 1 : 0);
        if (ix && iy) { ix *= 0.7071; iy *= 0.7071; }
        const tv = !ix && !iy ? tiltVector() : null;
        if (tv) { ix = tv.x; iy = tv.y; }
        const k = Math.min(1, dt * 14); p.vx += (ix * maxS - p.vx) * k; p.vy += (iy * maxS - p.vy) * k;

      if (p.y < b.y0) { p.y = b.y0; p.vy = Math.max(0, p.vy); } if (p.y > b.y1) { p.y = b.y1; p.vy = Math.min(0, p.vy); }

    } else if (this.state === 'goal') {
      this.goalT += dt;
      const nx = this.L.nest.x - this.cam - 10, ny = this.L.nest.gy - 150;
      const px = p.x, py = p.y; p.x = lerp(p.x, nx, Math.min(1, dt * 2.2)); p.y = lerp(p.y, ny, Math.min(1, dt * 2.2));
      p.vx = (p.x - px) / dt; p.vy = (p.y - py) / dt;
      if (this.goalT > 1.1 && !this.celebrated) { this.celebrated = true; Sound.fanfare(); this.burst(this.L.nest.x, this.L.nest.gy - 110, 40, ['#ffd45c', '#fff', '#ff9fb2', '#8ff0c8'], 'star'); }
      if (this.goalT > 2.6) { this.finish(); return; }
    } else if (this.state === 'dying') {

      if (this.overT > 1.4) { this.state = 'over'; save.hearts = null; writeSave(); UI.showOver(); return; }
    }
    p.flap += dt * (p.vy < -80 ? 15 : p.vy > 150 ? 6 : 10);
    p.ang = lerp(p.ang, clamp(p.vy / 390 * 0.3, -0.3, 0.3), Math.min(1, dt * 8));

    this.comboT -= dt; if (this.comboT <= 0) this.combo = 0;

    // --- creatures ---
    const cam = this.cam, circles = this.hitCircles(), canHurt = this.state === 'play' && p.inv <= 0;
    for (const e of this.L.ents) {
      const sx = e.x - cam;
      if (sx < -250 || sx > W + 320) continue;
      if (e.flyer && e.alive) { e.x -= e.spd * dt; e.tt += dt; e.y = e.baseY + e.amp * Math.sin(e.tt * e.w + e.ph); }
      if (e.kind === 'jumper') {
        if (e.state === 'wait' && sx < W * 0.8) { e.state = 'ripple'; e.t = 0; }
        else if (e.state === 'ripple') { e.t += dt; if (e.t > 0.8) { e.state = 'jump'; e.y = R.ground + 6; e.vy = -Math.sqrt(2 * 900 * (R.ground - e.apex)); this.splash(e.x); } }
        else if (e.state === 'jump') { e.y += e.vy * dt; e.vy += 900 * dt; e.x -= 25 * dt; if (e.y > R.ground + 8 && e.vy > 0) { e.state = 'done'; this.splash(e.x); } }
      }

        e.t += dt;
        if (e.state === 'idle' && sx < W + 60) { e.state = 'charge'; e.t = 0; }
        else if (e.state === 'charge' && e.t > e.chargeT) { e.state = 'strike'; e.t = 0; this.shake = Math.max(this.shake, 0.15); if (sx > -40 && sx < W + 40) Sound.thunder(); }
        else if (e.state === 'strike' && e.t > 0.45) { e.state = 'rest'; e.t = 0; }
        else if (e.state === 'rest' && e.t > e.restT) { e.state = 'charge'; e.t = 0; }
        if (e.state === 'strike' && canHurt && p.inv <= 0) { const bx = { x: e.x - 13, y: e.cy + 18, w: 26, h: R.ground - e.cy - 18 }; for (const c of circles) if (circleRect(c, bx)) { this.hurt(); break; } }
        continue;
      }
      if (!canHurt || p.inv > 0) continue;
      if (e.boxes) { for (const bx of e.boxes) for (const c of circles) if (circleRect(c, bx)) { this.hurt(); break; } }
      else if (e.alive && (e.flyer || (e.kind === 'jumper' && e.state === 'jump'))) { for (const c of circles) if (Math.hypot(c.x - e.x, c.y - e.y) < c.r + e.rad) { this.hurt(); break; } }

    // --- dragon breath ---

      const f = this.proj[i]; f.x += f.vx * dt; f.y += f.vy * dt; f.life -= dt;
      if (Math.random() < 0.9) this.parts.push({ x: f.x - 8, y: f.y + (Math.random() - 0.5) * 8, vx: -60, vy: (Math.random() - 0.5) * 40, life: 0.35, max: 0.35, size: 6, color: bc[1 + Math.floor(Math.random() * 2)], type: 'spark' });

        if (e.alive && (e.flyer || (e.kind === 'jumper' && e.state === 'jump')) && Math.hypot(e.x - f.x, e.y - f.y) < e.rad + 14) {
          e.alive = false; dead = true; Sound.poof(); this.burst(e.x, e.y, 18, ['#fff', '#ffe680', '#c8f0ff'], 'star');

          if (isFish && this.hearts < HEART_CAP) { this.hearts++; this.text(e.x, e.y - 24, '+1 ♥ bonus!', '#ffd45c'); this.burst(e.x, e.y, 12, ['#ffd45c', '#ff5d73', '#fff'], 'star'); setTimeout(() => Sound.heart(), 120); HUD.update(); HUD.heartPop(); }
          else if (!isFish && this.hearts < this.maxHearts) { this.hearts++; this.text(e.x, e.y - 24, '+1 ♥', '#ff8fa3'); this.burst(e.x, e.y, 8, ['#ff5d73', '#ffb3c0'], 'spark'); setTimeout(() => Sound.heart(), 120); HUD.update(); HUD.heartPop(); }
          else this.text(e.x, e.y - 24, 'Shoo!', '#fff');

        }
        if (e.boxes && e.boxes.some(bx => circleRect({ x: f.x, y: f.y, r: 8 }, bx))) { dead = true; this.burst(f.x, f.y, 6, ['rgba(200,200,200,.8)'], 'smoke'); break; }
      }
      if (dead) this.proj.splice(i, 1);
    }
    if (this.state === 'play') HUD.progress(this.cam / stopX);
  },
  targetAhead() {

  },
  hurt() {

  },
  splash(x) { const R = REALMS[this.ri]; if (x - this.cam > -50 && x - this.cam < W + 50) Sound.splash(); for (let i = 0; i < 10; i++) this.parts.push({ x: x + (Math.random() - 0.5) * 20, y: R.ground, vx: (Math.random() - 0.5) * 120, vy: -120 - Math.random() * 160, g: 500, life: 0.7, max: 0.7, size: 4, color: BIOMES[R.biome].lava ? 'rgba(255,170,60,.95)' : 'rgba(230,248,255,.9)', type: 'spark' }); },
  burst(x, y, n, colors, type) {
    for (let i = 0; i < n; i++) { const a = Math.random() * TAU, s = 60 + Math.random() * 200; this.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.6 + Math.random() * 0.4, max: 1, size: type === 'star' ? 7 : type === 'smoke' ? 9 : 4, color: colors[i % colors.length], type, rot: Math.random() * TAU }); }
  },
  text(x, y, s, color) { this.texts.push({ x, y, s, color, life: 1 }); },
  updateParticles(dt) {
    for (let i = this.parts.length - 1; i >= 0; i--) { const q = this.parts[i]; q.life -= dt; if (q.life <= 0) { this.parts.splice(i, 1); continue; } q.x += q.vx * dt; q.y += q.vy * dt; if (q.g) q.vy += q.g * dt; q.vx *= 0.96; q.vy *= q.g ? 1 : 0.96; q.rot = (q.rot || 0) + dt * 5; }

  },
  finish() {
    const ri = this.ri, got = this.eggs;

    const newCh = save.chalices - prevCh;
    const newBest = got > save.best[ri]; save.best[ri] = Math.max(save.best[ri], got);
    const newCrown = got === 15 && !save.crowns[ri]; if (got === 15) save.crowns[ri] = true;
    if (ri < REALMS.length - 1) save.unlocked = Math.max(save.unlocked, ri + 2);
    save.hearts = this.hearts;
    writeSave();
    this.state = 'result'; HUD.show(false);
    Sound.play('title'); if (newCh || newCrown) setTimeout(() => Sound.chalice(), 700);
    UI.showResult({ ri, got, newCh, newCrown, newBest });
  },

  // ---------------- render ----------------
  render() {
    const k = canvas.width / W; ctx.setTransform(k, 0, 0, k, 0, 0);
    const menu = this.state === 'menu' || !this.L;
    const ri = menu ? this.menuRi : this.ri, cam = menu ? this.menuCam : this.cam, t = this.t;
    if (this.shake > 0) ctx.translate((Math.random() - 0.5) * 12 * this.shake, (Math.random() - 0.5) * 12 * this.shake);
    Art.drawBack(ctx, ri, cam, t);
    if (menu) {
      Art.drawFront(ctx, ri, cam, t); Art.weather(ctx, ri, cam, t);
      const x = ((t * 70) % (W + 300)) - 150, y = 150 + Math.sin(t * 1.2) * 40;
      ctx.save(); ctx.translate(x, y); ctx.rotate(Math.cos(t * 1.2) * -0.12); ctx.scale(0.95, 0.95); Art.dragon(ctx, save.dragon, t, t * 10); ctx.restore();
      return;
    }
    const R = REALMS[ri], L = this.L, inView = x => x - cam > -260 && x - cam < W + 260, lava = BIOMES[R.biome].lava;
    ctx.save(); ctx.translate(-cam, 0);
    for (const e of L.ents) {
      if (!inView(e.x)) continue;
      if (e.boxes) Art.prop(ctx, e, R, t);
      else if (e.kind === 'jumper' && e.alive && e.state === 'jump') Art.jumper(ctx, e.style, e.x, e.y, e.vy, t);
    }
    if (inView(L.nest.x)) Art.nest(ctx, L.nest.x, L.nest.gy, ri, t);
    ctx.restore();
    Art.drawFront(ctx, ri, cam, t);
    // soft shadow of the dragon on the ground, water or cave floor
    const p = this.p, alt = R.ground - p.y;
    if (p.alive) Art.contactShadow(ctx, p.x + 6, R.ground + (R.cat === 'water' ? 2 : 0), 46 * clamp(1.2 - alt / 500, 0.5, 1.1), clamp(0.32 - alt / 1400, 0.06, 0.3));
    ctx.save(); ctx.translate(-cam, 0);
    for (const e of L.ents) {
      if (!inView(e.x)) continue;
      if (e.kind === 'jumper' && e.state === 'ripple') Art.ripple(ctx, e.x, R.ground, e.t / 0.8, lava);
      if (e.kind === 'storm') Art.storm(ctx, e, R, t);
    }
    for (const eg of L.eggs) {
      if (eg.got || !inView(eg.x + eg.dx)) continue;
      Art.egg(ctx, eg.x + eg.dx, eg.by + eg.dy + Math.sin(t * 2.4 + eg.x * 0.01) * 5, t, ri);
    }
    for (const e of L.ents) if (e.flyer && e.alive && inView(e.x)) Art.flyer(ctx, e.style, e.x, e.y, t, e.ph);
    const bc = DRAGONS[save.dragon].breath;
    for (const f of this.proj) { Art.glow(ctx, f.x, f.y, 22, 'rgba(255,240,180,A)', 0.6); Art.ell(ctx, f.x, f.y, 11, 8, 0, bc[1]); Art.ell(ctx, f.x + 2, f.y, 6, 4.5, 0, bc[0]); }
    ctx.restore();
    // player
    if (!(p.inv > 0 && Math.floor(p.inv * 12) % 2 === 0) || this.state === 'intro') {
      ctx.save(); ctx.translate(p.x, p.y + (this.state === 'intro' ? Math.sin(t * 2) * 6 : 0)); ctx.rotate(p.ang); ctx.scale(DS, DS);
      Art.dragon(ctx, save.dragon, t, p.flap); ctx.restore();
    }
    // particles + text
    ctx.save(); ctx.translate(-cam, 0);
    for (const q of this.parts) {
      const a = clamp(q.life / q.max, 0, 1); ctx.globalAlpha = a;
      if (q.type === 'star') { ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot); ctx.fillStyle = q.color; ctx.beginPath(); for (let i = 0; i < 10; i++) { const r = i % 2 ? q.size * 0.45 : q.size, an = i / 10 * TAU; ctx.lineTo(Math.cos(an) * r, Math.sin(an) * r); } ctx.fill(); ctx.restore(); }
      else { ctx.fillStyle = q.color; ctx.beginPath(); ctx.arc(q.x, q.y, q.type === 'smoke' ? q.size * (1.6 - a) : q.size * (0.4 + a * 0.6), 0, TAU); ctx.fill(); }
    }
    ctx.globalAlpha = 1;
    ctx.font = '900 26px ui-rounded, "Trebuchet MS", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    for (const q of this.texts) { ctx.globalAlpha = clamp(q.life * 1.5, 0, 1); ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.strokeText(q.s, q.x, q.y); ctx.fillStyle = q.color; ctx.fillText(q.s, q.x, q.y); }
    ctx.globalAlpha = 1; ctx.restore();
    Art.weather(ctx, ri, cam, t);
    // warnings for creatures about to fly in
    if (this.state === 'play') for (const e of L.ents) {
      if (!e.flyer || !e.alive) continue; const sx = e.x - cam;
      if (sx > W + 10 && sx < W + 300) Art.warning(ctx, W - 26, clamp(e.y, 70, H - 40), t);
    }
  }
};
function circleRect(c, b) { const nx = clamp(c.x, b.x, b.x + b.w), ny = clamp(c.y, b.y, b.y + b.h); return (c.x - nx) ** 2 + (c.y - ny) ** 2 < c.r * c.r; }

// ---------------- HUD ----------------
const HEART_CAP = 10; // fish can bank hearts above the dragon's normal maximum, up to this many
const HEART = (f, gold) => `<svg viewBox="0 0 24 22"><path d="M12 21s-9-6-9-12.2C3 5.5 5.4 3 8.3 3c1.7 0 3 .8 3.7 2 .7-1.2 2-2 3.7-2C18.6 3 21 5.5 21 8.8 21 15 12 21 12 21z" fill="${f ? (gold ? '#ffc93c' : '#ff5d73') : 'rgba(255,255,255,.18)'}" stroke="${f ? '#fff' : 'rgba(255,255,255,.55)'}" stroke-width="1.8"/></svg>`;
const HUD = {
  lastP: -1, lastH: '',
  show(on) { $('#hud').classList.toggle('hidden', !on); },
  update(pop) {
    $('#hudEggs').textContent = `${Game.eggs} / 15`;
    let h = ''; for (let i = 0; i < Math.max(Game.maxHearts, Game.hearts); i++) h += HEART(i < Game.hearts, i >= Game.maxHearts);
    if (h !== this.lastH) { $('#hudHearts').innerHTML = h; this.lastH = h; }
    if (pop) { const e = $('#hudEggIco'); e.classList.remove('pop'); void e.offsetWidth; e.classList.add('pop'); }
    this.progress(Game.cam / Math.max(1, Game.L.nest.x - W * 0.7));
  },
  heartPop() { const e = $('#hudHearts'); e.classList.remove('pop'); void e.offsetWidth; e.classList.add('pop'); },
  progress(f) { const v = Math.round(clamp(f, 0, 1) * 200); if (v !== this.lastP) { this.lastP = v; $('#hudFill').style.width = (v / 2) + '%'; } }
};

// ============ UI: menus, settings, boot ============
const UI = {
  cur: null, from: 'title', pickKey: save.dragon, msg: '', setupNew: false,
  show(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === 'scr-' + id));
    this.cur = id;
    if (id === 'title') this.fillTitle();
    if (id === 'setup') this.fillSetup();
    if (id === 'map') this.fillMap();
    if (id === 'pause') this.fillSettings($('#pauseSettings'));
    if (id === 'settings') this.fillSettings($('#mainSettings'));
  },
  hideAll() { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); this.cur = null; },
  primary() { const b = document.querySelector('.screen.active [data-primary]'); if (b && !b.disabled) b.click(); },
  onResize() { if (this.cur === 'map') this.drawThumbs(); if (this.cur === 'setup') this.sizePreviews(); },

  fillTitle() {
    const list = $('#riderList');
    if (HUB_PLAYER) {
      $('#titleWho').textContent = save.rider ? `Welcome back, ${riderName()} and ${dragonName()}!` : `Hi, ${HUB_PLAYER}! Tap Play to meet your dragon.`;
      list.innerHTML = ''; $('#btnNewRider').style.display = 'none';
    } else {
      $('#titleWho').textContent = save.rider ? `Welcome back, ${riderName()} and ${dragonName()}!` : (roster.list.length ? "Who's flying today?" : '');
      list.innerHTML = roster.list.length > 1 || (roster.list.length && !save.rider) ? roster.list.map(n => `<button class="btn small${save.rider && n.toLowerCase() === save.rider.toLowerCase() ? ' on' : ' alt'}" data-action="pickRider" data-n="${escHtml(n)}">${escHtml(n)}</button>`).join('') : '';
      $('#btnNewRider').style.display = roster.list.length ? '' : 'none';
    }
    $('#titleHint').textContent = isTouch ? 'Drag your finger to fly. Fire comes out by itself!' : 'Arrow keys or WASD to fly · Space to breathe fire · P to pause';
  },
  fillSetup() {
    const r = $('#inRider');
    r.value = HUB_PLAYER || (this.setupNew ? '' : save.rider); r.readOnly = !!HUB_PLAYER;
    $('#inDragon').value = this.setupNew ? '' : save.dragonName; this.pickKey = this.setupNew ? 'ember' : save.dragon;
    $('#dragonCards').innerHTML = DRAGON_KEYS.map(k => { const D = DRAGONS[k];
      return `<button class="dcard${k === this.pickKey ? ' sel' : ''}" data-action="pick" data-k="${k}"><canvas></canvas><b>${D.name}</b><span>${D.desc}</span><i>${'♥'.repeat(D.hearts)}</i></button>`; }).join('');
    this.sizePreviews();
  },
  sizePreviews() {
    const d = Math.min(2, window.devicePixelRatio || 1);
    document.querySelectorAll('.dcard canvas').forEach(c => { const r = c.getBoundingClientRect(); c.width = Math.max(10, Math.round(r.width * d)); c.height = Math.max(10, Math.round(r.height * d)); });
  },
  drawPreviews(t) {
    document.querySelectorAll('.dcard').forEach(card => {
      const c = card.querySelector('canvas'), g = c.getContext('2d'), k = card.dataset.k, sel = k === this.pickKey;
      g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, c.width, c.height);
      const s = c.height / 122; g.setTransform(s, 0, 0, s, c.width / 2 + 15 * s, c.height * 0.64);
      Art.dragon(g, k, sel ? t : 0.3, sel ? t * 10 : 1.2);
    });
  },
  fillMap() {
    const crowns = save.crowns.filter(Boolean).length;
    $('#trophies').innerHTML = `<span>🏆 ${save.chalices}</span><span>👑 ${crowns}/${REALMS.length}</span><span>🥚 ${10 - save.totalEggs % 10} to next 🏆</span>`;
    $('#realmCards').innerHTML = REALMS.map((R, i) => {
      const locked = i + 1 > save.unlocked;
      const st = locked ? '🔒' : `${save.best[i]}/15${save.crowns[i] ? ' 👑' : ''}`;
      return `<button class="rcard" data-action="realm" data-i="${i}" ${locked ? 'disabled' : ''} ${i === save.unlocked - 1 ? 'data-primary' : ''} title="${R.name}"><canvas></canvas><b>${i + 1}. ${R.short}</b><span>${st}</span></button>`;
    }).join('');
    requestAnimationFrame(() => this.drawThumbs());
  },
  drawThumbs() {
    // draw a few thumbnails per frame so opening the map never stalls
    const list = [...document.querySelectorAll('.rcard canvas')]; let i = 0;
    const step = () => { const t0 = performance.now(); while (i < list.length && performance.now() - t0 < 12) { Art.thumb(list[i], i); i++; } if (i < list.length && this.cur === 'map') requestAnimationFrame(step); };
    step();
  },
  fillSettings(el) {
    const fsOK = !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
    let h = `<div class="row"><button class="btn small ${save.music ? 'on' : 'alt'}" data-action="music">Music: ${save.music ? 'On' : 'Off'}</button>
      <button class="btn small ${save.sfx ? 'on' : 'alt'}" data-action="sfx">Sounds: ${save.sfx ? 'On' : 'Off'}</button></div>`;
    if (isTouch) {
      h += `<div class="lbl">Steer the dragon by</div><div class="row">
        <button class="btn small ${save.control === 'drag' ? 'on' : 'alt'}" data-action="ctlDrag">Dragging a finger</button>
        <button class="btn small ${save.control === 'tilt' ? 'on' : 'alt'}" data-action="ctlTilt">Tilting the phone</button></div>`;
      if (save.control === 'tilt') h += `<p class="small">Hold the phone the way that feels comfy, then tap Recenter.</p><button class="btn small alt" data-action="recenter">Recenter tilt</button>`;
    }
    if (fsOK && isTouch) h += `<button class="btn small alt" data-action="fullscreen">Full screen</button>`;
    if (this.cur === 'settings') h += `<button class="btn small alt" data-action="erase" id="btnErase">Erase this rider</button>`;
    h += `<p class="small" id="setMsg">${this.msg}</p>`;
    el.innerHTML = h; this.msg = '';
  },
  refreshSettings() {
    if (this.cur === 'result') this.toggles($('#resToggles')); if (this.cur === 'over') this.toggles($('#overToggles')); if (this.cur === 'pause') this.fillSettings($('#pauseSettings')); if (this.cur === 'settings') this.fillSettings($('#mainSettings')); },
  showIntro(ri) {
    const R = REALMS[ri];
    $('#introKicker').textContent = `Realm ${ri + 1} of ${REALMS.length}`;
    $('#introName').textContent = R.name; $('#introStory').textContent = R.story;
    let tip;
    if (!isTouch) tip = 'Arrow keys to fly. Space to breathe fire at birds and bats.';
    else if (save.control === 'tilt') tip = 'Tilt to fly. Drag works too. Fire comes out by itself!';
    else tip = 'Drag your finger anywhere to fly. Fire comes out by itself!';
    if (ri === 0) tip += ' A red ! means something is flying in.';
    if (ri === 0 || ri === 3) tip += ' Breathe fire on animals to shoo them away and win back a heart!';
    if (REALMS[ri].skin.jumper && REALMS[ri].skin.jumper !== 'lava') tip += ' Hit a jumping fish with fire for a bonus gold heart you can save for later realms!';
    $('#introTip').textContent = tip;
    $('#introHearts').innerHTML = `${dragonName()} starts with ${this.heartsText(Game.hearts, Game.maxHearts)}`;
    this.show('intro');
  },
  toggles(el) {
    el.innerHTML = `<button class="btn small ${save.music ? 'on' : 'alt'}" data-action="music">Music: ${save.music ? 'On' : 'Off'}</button><button class="btn small ${save.sfx ? 'on' : 'alt'}" data-action="sfx">Sounds: ${save.sfx ? 'On' : 'Off'}</button>`;
  },
  heartsText(n, max) { return '♥'.repeat(Math.min(n, max)) + '<span style="opacity:.35">' + '♥'.repeat(Math.max(0, max - n)) + '</span>' + (n > max ? '<span style="color:#ffc93c">' + '♥'.repeat(n - max) + '</span>' : ''); },
  showResult({ ri, got, newCh, newCrown, newBest }) {
    const R = REALMS[ri];
    $('#resKicker').textContent = R.name;
    $('#resTitle').textContent = got === 15 ? 'Every egg is home!' : got >= 10 ? 'Great flying!' : 'You made it home!';
    let e = ''; for (let i = 0; i < 15; i++) e += `<span class="egg-ico${i < got ? '' : ' off'}"></span>`;
    $('#resEggs').innerHTML = e;
    const m = [`<p>${riderName()} and ${dragonName()} found <b>${got}</b> of 15 eggs.${newBest && got < 15 ? ' A new best!' : ''}</p>`];
    if (newCrown) m.push(`<p>👑 You won the crown of ${R.short}!</p>`);
    if (newCh) m.push(`<p>🏆 You earned ${newCh > 1 ? newCh + ' golden chalices' : 'a golden chalice'}!</p>`);
    if (ri === REALMS.length - 1) m.push(`<p>You flew through all the Dragon Realms!</p>`);
    $('#resMsgs').innerHTML = m.join('');
    const crowns = save.crowns.filter(Boolean).length;
    $('#resTrophies').innerHTML = `<span>🏆 ${save.chalices} chalice${save.chalices === 1 ? '' : 's'} in all</span><span>👑 ${crowns} of ${REALMS.length} crowns</span><span>🥚 ${10 - save.totalEggs % 10} more to the next chalice</span>`
      + (ri < REALMS.length - 1 ? `<span class="hearts-line">Hearts for the next realm: ${this.heartsText(Game.hearts, Game.maxHearts)}</span>` : '');
    this.toggles($('#resToggles'));
    let b = '';
    if (ri < REALMS.length - 1) b += `<button class="btn" data-action="next" data-primary>Next realm</button><button class="btn alt" data-action="again">Fly again</button>`;
    else b += `<button class="btn" data-action="again" data-primary>Fly again</button>`;
    b += `<button class="btn alt" data-action="quit">Map</button>`;
    $('#resBtns').innerHTML = b;
    this.show('result');
  },
  showOver() {
    $('#overTitle').textContent = `${dragonName()} needs a rest!`;
    $('#overMsg').textContent = `You found ${Game.eggs} egg${Game.eggs === 1 ? '' : 's'}. Try again with all your hearts back!`;
    this.toggles($('#overToggles'));
    Sound.play('title');
    this.show('over');
  }
};

function goFullscreen() {
  const el = document.documentElement, fn = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!fn || document.fullscreenElement || document.webkitFullscreenElement) return;
  try { const pr = fn.call(el); if (pr && pr.then) pr.then(() => { try { screen.orientation.lock('landscape').catch(() => { }); } catch (e) { } }).catch(() => { }); } catch (e) { }
}

const ACTIONS = {
  play() { if (save.rider) UI.show('map'); else { UI.setupNew = true; UI.show('setup'); } },
  newRider() { UI.setupNew = true; UI.show('setup'); },
  pickRider(b) { loadRider(b.dataset.n); writeSave(); UI.show('map'); },
  settings() { UI.from = UI.cur; UI.show('settings'); },
  settingsBack() { UI.show(UI.from === 'map' ? 'map' : 'title'); },
  toTitle() { UI.show('title'); },
  pick(b) { UI.pickKey = b.dataset.k; document.querySelectorAll('.dcard').forEach(c => c.classList.toggle('sel', c === b)); },
  setupDone() {
    const name = HUB_PLAYER || cleanName($('#inRider').value) || 'Torin', had = findRider(name);
    if (had && UI.setupNew) {
      // That name already has a save: open it instead of wiping it.
      loadRider(had); writeSave(); UI.setupNew = false; document.activeElement && document.activeElement.blur && document.activeElement.blur();
      UI.show('map'); return;
    }
    if (UI.setupNew) { loadRider(''); }
    UI.setupNew = false;
    save.rider = name;
    save.dragon = UI.pickKey;
    save.dragonName = $('#inDragon').value.trim().slice(0, 14) || DRAGONS[save.dragon].name;
    writeSave(); Art.resetThumbs(); document.activeElement && document.activeElement.blur && document.activeElement.blur();
    UI.show('map');
  },
  realm(b) { const i = +b.dataset.i; if (i + 1 > save.unlocked) return; Game.prepare(i); UI.showIntro(i); },
  async start() {
    UI.hideAll();
    if (isTouch) goFullscreen();
    if (isTouch && save.control === 'tilt' && !Input.tilt.on) await enableTilt();
    Game.usingKeys = !isTouch;
    Game.begin();
  },
  pause() { Game.togglePause(); },
  resume() { Game.togglePause(); },
  restart() { Game.restart(); },
  quit() { Game.toMenu(); UI.show('map'); },
  retry() { Game.restart(); },
  again() { Game.prepare(Game.ri); UI.hideAll(); Game.begin(); },
  next() { const i = Game.ri + 1; Game.prepare(i); UI.showIntro(i); },
  music() { Sound.setMusic(!save.music); UI.refreshSettings(); },
  sfx() { Sound.setSfx(!save.sfx); UI.refreshSettings(); },
  ctlDrag() { save.control = 'drag'; Input.tilt.on = false; writeSave(); UI.refreshSettings(); },
  async ctlTilt() {
    const ok = await enableTilt();
    if (!ok) { UI.msg = 'Tilt needs permission. Try again and tap Allow.'; UI.refreshSettings(); return; }
    save.control = 'tilt'; writeSave(); UI.refreshSettings();
    setTimeout(() => { if (!Input.tilt.raw) { save.control = 'drag'; Input.tilt.on = false; writeSave(); UI.msg = 'This device did not send tilt readings, so dragging is still on.'; UI.refreshSettings(); } }, 1500);
  },
  recenter() { recenterTilt(); UI.msg = 'Tilt recentered!'; UI.refreshSettings(); },
  fullscreen() { goFullscreen(); },
  erase(b) {
    if (b.dataset.armed) {
      const who = save.rider;
      if (who) removeRider(who);
      loadRider(HUB_PLAYER ? '' : roster.current);
      UI.msg = who ? `${who}'s progress erased. Other riders are safe.` : 'Progress erased.'; UI.refreshSettings();
    } else { b.dataset.armed = '1'; b.textContent = `Tap again to erase ${save.rider || 'this rider'}`; }
  },
  rotateOK() { rotateDismissed = true; checkOrientation(); }
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]'); if (!b || b.disabled) return;
  Sound.init(); Sound.click();
  const f = ACTIONS[b.dataset.action]; if (f) f(b);
});
document.addEventListener('pointerdown', () => Sound.init(), { passive: true });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (Game.state === 'play') Game.togglePause(); Sound.suspend(); }
  else Sound.resume();
});
document.addEventListener('fullscreenchange', () => setTimeout(resize, 50));
window.addEventListener('resize', resize);

// ---------------- boot ----------------
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000)); lastT = now;
  Game.update(dt); Game.render();
  if (UI.cur === 'setup') UI.drawPreviews(now / 1000);
  requestAnimationFrame(frame);
}
resize(); Art.prepareRes(); booted = true;
UI.show('title');
Sound.play('title');
requestAnimationFrame(frame);

</script>
